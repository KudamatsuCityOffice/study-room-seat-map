<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習スペース 空席状況</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin: 0;
      margin-bottom: 20px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legend span {
      font-size: 14px;
    }

    /* グリッドレイアウト */
    .layout {
      display: grid;
      grid-template-columns: repeat(7, 40px);
      grid-template-rows: repeat(8, 40px);
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .seat {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* 空席（○）= 緑 */
    .seat.empty {
      background: #c8e6c9;
      border-color: #4caf50;
      color: #2e7d32;
    }

    /* 使用中（×）= 赤 */
    .seat.used {
      background: #ffcdd2;
      border-color: #f44336;
      color: #c62828;
    }

    /* 出入口 */
    .entrance {
      background: transparent;
      border: none;
      color: #666;
      font-size: 12px;
      font-weight: normal;
    }

    .seat-number {
      font-size: 8px;
      margin-bottom: 1px;
    }

    .seat-status {
      font-size: 14px;
    }

    /* 席15、16、17、18を中央に配置 */
    .seat.center-align {
      align-items: center;
      justify-content: center;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 24px;
      font-size: 16px;
      font-weight: bold;
    }

    .stats-empty {
      color: #2e7d32;
    }

    .stats-used {
      color: #c62828;
    }

    .note {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 13px;
    }

    .error {
      text-align: center;
      color: #d32f2f;
      margin-top: 12px;
      font-size: 14px;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
    }

    .loading {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 14px;
    }

    .success {
      text-align: center;
      color: #2e7d32;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>学習スペース空席状況</h1>

    <div class="legend">
      <span>○: 空席（緑）</span>
      <span>×: 使用中（赤）</span>
    </div>

    <div class="layout" id="seatMap">
      <div class="loading">読み込み中...</div>
    </div>

    <div class="stats">
      <div id="emptyCount" class="stats-empty">空席: 0</div>
      <div id="usedCount" class="stats-used">使用中: 0</div>
    </div>

    <div class="note">最終更新時刻</div>
    <div id="successMessage"></div>
    <div id="errorMessage"></div>
  </div>

  <script>
    // ★★★ ここから修正してください ★★★

    // Google Apps ScriptのデプロイURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx7x76PD34x02ywLm0I8eIfBrA-SwN9HMEpJJ8Cz4ULEu-JN3xRNgwPlcVURhY7EOEX/exec';

    // ★★★ ここまで修正してください ★★★

    // 座席表を生成する関数
    async function fetchSeatData() {
      try {
        // エラーメッセージをクリア
        document.getElementById('errorMessage').innerHTML = '';
        document.getElementById('successMessage').innerHTML = '';

        const response = await fetch(GAS_URL);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        if (!data.records || data.records.length === 0) {
          throw new Error('kintoneにレコードが存在しません');
        }

        // 最新レコードを使用
        updateSeatMap(data.records[0]);

        // 成功メッセージを表示
        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('successMessage').innerHTML = 
          `<div class="success">${now}</div>`;

      } catch (error) {
        console.error('Error fetching data from kintone:', error);
        document.getElementById('errorMessage').innerHTML = 
          `<div class="error">エラー: ${error.message}</div>`;
      }
    }

    // 座席表を更新する関数
    function updateSeatMap(record) {
      const seatMap = document.getElementById('seatMap');
      seatMap.innerHTML = ''; // 既存の内容をクリア

      let emptyCount = 0;
      let usedCount = 0;

      // 座席情報を取得する関数
      function getSeatStatus(seatNumber) {
        const fieldCode = `席${seatNumber}`;
        const status = record[fieldCode]?.value || '';
        return status;
      }

      // 座席要素を作成する関数
      function createSeatElement(seatNumber) {
        const status = getSeatStatus(seatNumber);
        const seat = document.createElement('div');
        
        // ○ = 空席（緑）、× = 使用中（赤）
        if (status === '○') {
          seat.className = 'seat empty';
          emptyCount++;
        } else {
          seat.className = 'seat used';
          usedCount++;
        }

        // 席15、16、17、18を中央に配置
        if ([15, 16, 17, 18].includes(seatNumber)) {
          seat.classList.add('center-align');
        }
        
        seat.innerHTML = `
          <div class="seat-number">席${seatNumber}</div>
          <div class="seat-status">${status}</div>
        `;
        return seat;
      }

      // 出入口要素を作成する関数
      function createEntranceElement() {
        const entrance = document.createElement('div');
        entrance.className = 'seat entrance';
        entrance.innerHTML = '出入口';
        return entrance;
      }

      // グリッドレイアウト定義
      // (X, Y) = (縦, 横)
      const grid = [
        // 1段目
        [null, 'seat11', 'seat12', null, 'seat13', 'seat14', null],
        // 2段目（全て空白）
        [null, null, null, null, null, null, null],
        // 3段目
        ['seat10', null, null, null, null, null, 'seat1'],
        // 4段目
        ['seat9', null, 'seat15', 'seat16', null, null, 'seat2'],
        // 5段目
        [null, null, 'seat17', 'seat18', null, null, null],
        // 6段目
        ['seat8', null, null, null, null, null, 'seat3'],
        // 7段目
        ['seat7', null, null, null, null, null, 'seat4'],
        // 8段目
        [null, 'entrance', null, 'seat6', 'seat5', null, null]
      ];

      // 処理済みの座席を追跡
      const processedSeats = new Set();

      // グリッドを生成
      for (let x = 0; x < grid.length; x++) {
        for (let y = 0; y < grid[x].length; y++) {
          const seatCode = grid[x][y];
          
          if (!seatCode) {
            // 空白
            continue;
          }

          // 既に処理済みの座席はスキップ
          if (processedSeats.has(seatCode + '_' + x + '_' + y)) {
            continue;
          }

          let seatElement;

          if (seatCode === 'entrance') {
            // 出入口
            seatElement = createEntranceElement();
          } else {
            // 座席番号を抽出
            const seatNumber = parseInt(seatCode.replace('seat', ''));
            seatElement = createSeatElement(seatNumber);
          }
          
          // グリッド位置を設定
          seatElement.style.gridColumn = y + 1;
          seatElement.style.gridRow = x + 1;
          
          seatMap.appendChild(seatElement);
          processedSeats.add(seatCode + '_' + x + '_' + y);
        }
      }

      // 統計情報を更新
      document.getElementById('emptyCount').textContent = `空席: ${emptyCount}`;
      document.getElementById('usedCount').textContent = `使用中: ${usedCount}`;
    }

    // ページ読み込み時にデータを取得
    window.addEventListener('load', function() {
      fetchSeatData();
      
      // 30秒ごとに自動更新
      setInterval(fetchSeatData, 30000);
    });
  </script>
</body>
</html>
