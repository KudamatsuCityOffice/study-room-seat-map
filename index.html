<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自習室 空席状況</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      margin: 0;
    }

    h2 {
      margin-top: 8px;
      margin-bottom: 20px;
      color: #666;
      font-weight: normal;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legend span {
      font-size: 14px;
    }

    /* 全体レイアウト */
    .layout {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* 左側グループ（縦1列） */
    .group-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 中央グループ */
    .group-center {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    /* 中央上段（横3席） */
    .group-center-top {
      display: flex;
      gap: 10px;
    }

    /* 中央中段（上下2席） */
    .group-center-middle {
      display: flex;
      gap: 10px;
    }

    /* 中央下段（横3席） */
    .group-center-bottom {
      display: flex;
      gap: 10px;
    }

    /* 右側グループ（縦1列） */
    .group-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seat {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      border: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background: #e8f5e9;
    }

    .seat.empty {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }

    .seat.used {
      background: #ffebee;
      border-color: #f44336;
      color: #c62828;
    }

    .seat-number {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .seat-status {
      font-size: 24px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 24px;
      font-size: 16px;
    }

    .note {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 13px;
    }

    .error {
      text-align: center;
      color: #d32f2f;
      margin-top: 12px;
      font-size: 14px;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
    }

    .loading {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 14px;
    }

    .success {
      text-align: center;
      color: #2e7d32;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>自習室</h1>
    <h2>空席状況</h2>

    <div class="legend">
      <span>〇: 空席</span>
      <span>×: 使用中</span>
    </div>

    <div class="layout" id="seatMap">
      <div class="loading">読み込み中...</div>
    </div>

    <div class="stats">
      <div id="emptyCount">空席: 0</div>
      <div id="usedCount">使用中: 0</div>
    </div>

    <div class="note">スマホでは横スクロールしてご覧ください</div>
    <div id="successMessage"></div>
    <div id="errorMessage"></div>
  </div>

  <script>
    // ★★★ ここから修正してください ★★★

    // Google Apps ScriptのデプロイURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx7x76PD34x02ywLm0I8eIfBrA-SwN9HMEpJJ8Cz4ULEu-JN3xRNgwPlcVURhY7EOEX/exec';

    // ★★★ ここまで修正してください ★★★

    // 座席表を生成する関数
    async function fetchSeatData() {
      try {
        // エラーメッセージをクリア
        document.getElementById('errorMessage').innerHTML = '';
        document.getElementById('successMessage').innerHTML = '';

        const response = await fetch(GAS_URL);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        if (!data.records || data.records.length === 0) {
          throw new Error('kintoneにレコードが存在しません');
        }

        // 最新レコードを使用
        updateSeatMap(data.records[0]);

        // 成功メッセージを表示
        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('successMessage').innerHTML = 
          `<div class="success">最終更新: ${now}</div>`;

      } catch (error) {
        console.error('Error fetching data from kintone:', error);
        document.getElementById('errorMessage').innerHTML = 
          `<div class="error">エラー: ${error.message}</div>`;
      }
    }

    // 座席表を更新する関数
    function updateSeatMap(record) {
      const seatMap = document.getElementById('seatMap');
      seatMap.innerHTML = ''; // 既存の内容をクリア

      let emptyCount = 0;
      let usedCount = 0;

      // 座席情報を取得する関数
      function getSeatStatus(seatNumber) {
        const fieldCode = `席${seatNumber}`;
        const status = record[fieldCode]?.value || '〇';
        // ★★★ ここから修正 ★★★
        if (status === '×') {
          emptyCount++;
        } else {
          usedCount++;
        }
        // ★★★ ここまで修正 ★★★
        return status;
      }

      // 座席要素を作成する関数
      function createSeatElement(seatNumber) {
        const status = getSeatStatus(seatNumber);
        const seat = document.createElement('div');
        // ★★★ ここから修正 ★★★
        seat.className = `seat ${status === '×' ? 'empty' : 'used'}`;
        // ★★★ ここまで修正 ★★★
        seat.innerHTML = `
          <div class="seat-number">席${seatNumber}</div>
          <div class="seat-status">${status}</div>
        `;
        return seat;
      }

      // 左側グループ（席10～15）
      const groupLeft = document.createElement('div');
      groupLeft.className = 'group-left';
      for (let i = 10; i <= 15; i++) {
        groupLeft.appendChild(createSeatElement(i));
      }

      // 中央グループ
      const groupCenter = document.createElement('div');
      groupCenter.className = 'group-center';

      // 中央上段（席16～18）
      const centerTop = document.createElement('div');
      centerTop.className = 'group-center-top';
      for (let i = 16; i <= 18; i++) {
        centerTop.appendChild(createSeatElement(i));
      }
      groupCenter.appendChild(centerTop);

      // 中央中段（席19、20）
      const centerMiddle = document.createElement('div');
      centerMiddle.className = 'group-center-middle';
      centerMiddle.appendChild(createSeatElement(19));
      centerMiddle.appendChild(createSeatElement(20));
      groupCenter.appendChild(centerMiddle);

      // 中央下段（席7～9）
      const centerBottom = document.createElement('div');
      centerBottom.className = 'group-center-bottom';
      for (let i = 7; i <= 9; i++) {
        centerBottom.appendChild(createSeatElement(i));
      }
      groupCenter.appendChild(centerBottom);

      // 右側グループ（席1～6）
      const groupRight = document.createElement('div');
      groupRight.className = 'group-right';
      for (let i = 1; i <= 6; i++) {
        groupRight.appendChild(createSeatElement(i));
      }

      // 全てを追加
      seatMap.appendChild(groupLeft);
      seatMap.appendChild(groupCenter);
      seatMap.appendChild(groupRight);

      // 統計情報を更新
      document.getElementById('emptyCount').textContent = `空席: ${emptyCount}`;
      document.getElementById('usedCount').textContent = `使用中: ${usedCount}`;
    }

    // ページ読み込み時にデータを取得
    window.addEventListener('load', function() {
      fetchSeatData();
      
      // 30秒ごとに自動更新
      setInterval(fetchSeatData, 30000);
    });
  </script>
</body>
</html>
